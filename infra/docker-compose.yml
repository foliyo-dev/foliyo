# Future Docker support — VPS + pqpm is the primary deployment method.
version: "3.8"
services:
  core:
    build: ./apps/core
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    environment:
      - NODE_ENV=production
      - FOLIYO_DB_PATH=/data/foliyo.db
      - FOLIYO_DATA_DIR=/data

  dashboard:
    build: ./apps/dashboard
    ports: ["3000:80"]

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/example.nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [core, dashboard]
