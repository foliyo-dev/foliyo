name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - run: pnpm install
      - name: Build dashboard
        run: pnpm --filter @foliyo/dashboard build
      - name: Compile binaries
        run: |
          pnpm --filter @foliyo/core compile:amd64
          pnpm --filter @foliyo/core compile:arm64
      - name: Package dashboard
        run: |
          mkdir -p dist
          tar -czf dist/dashboard-build.tar.gz -C apps/dashboard build/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/foliyo-linux-amd64
            dist/foliyo-linux-arm64
            dist/dashboard-build.tar.gz
