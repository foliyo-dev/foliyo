name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Sync brand assets
        run: ./scripts/sync-brand-assets.sh
      - name: Build dashboard
        run: pnpm --filter @foliyo/dashboard build
      - name: Bundle core (Node 22)
        env:
          SKIP_PNPM_INSTALL: "1"
        run: ./scripts/build-core-bundle.sh
      - name: Package dashboard
        run: tar -czf dist/dashboard-build.tar.gz -C apps/dashboard build/
      - name: Pack @foliyo/* libraries
        run: |
          chmod +x ./scripts/pack-libs.sh
          ./scripts/pack-libs.sh
      - name: Smoke start
        run: |
          set -euo pipefail
          SMOKE_DATA="$RUNNER_TEMP/foliyo-smoke"
          mkdir -p "$SMOKE_DATA"
          FOLIYO_ADMIN_EMAIL=smoke@localhost \
          FOLIYO_ADMIN_PASSWORD=changeme \
          FOLIYO_DATA_DIR="$SMOKE_DATA" \
          FOLIYO_DB_PATH="$SMOKE_DATA/foliyo.db" \
          FOLIYO_PORT=18080 \
          ./dist/core/foliyo &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:18080/welcome" >/dev/null; then
              echo "Smoke OK"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke failed: core did not respond on :18080/welcome" >&2
          exit 1
      - name: Release notes
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "body<<EOF"
            echo "## Self-host (Node.js 22.5+)"
            echo ""
            echo "- \`foliyo-core.tar.gz\` — API + public pages (\`./foliyo\` wrapper)"
            echo "- \`dashboard-build.tar.gz\` — static dashboard"
            echo ""
            echo "Install: \`curl -sSL https://foliyo.dev/install.sh | bash\`"
            echo ""
            echo "## Libraries (\`@foliyo/*\` — npm later)"
            echo ""
            echo "Install from this release (example):"
            echo ""
            echo '```json'
            echo "\"@foliyo/core\": \"https://github.com/foliyo-dev/foliyo/releases/download/${GITHUB_REF_NAME}/foliyo-core-${VER}.tgz\","
            echo "\"@foliyo/themes\": \"https://github.com/foliyo-dev/foliyo/releases/download/${GITHUB_REF_NAME}/foliyo-themes-${VER}.tgz\","
            echo "\"@foliyo/brand\": \"https://github.com/foliyo-dev/foliyo/releases/download/${GITHUB_REF_NAME}/foliyo-brand-${VER}.tgz\","
            echo "\"@foliyo/ui\": \"https://github.com/foliyo-dev/foliyo/releases/download/${GITHUB_REF_NAME}/foliyo-ui-${VER}.tgz\""
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/foliyo-core.tar.gz
            dist/dashboard-build.tar.gz
            dist/packages/foliyo-core-*.tgz
            dist/packages/foliyo-brand-*.tgz
            dist/packages/foliyo-ui-*.tgz
            dist/packages/foliyo-themes-*.tgz
          body: ${{ steps.meta.outputs.body }}
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: foliyo-release
          path: |
            dist/foliyo-core.tar.gz
            dist/dashboard-build.tar.gz
            dist/packages/*.tgz
